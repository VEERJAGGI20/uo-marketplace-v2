let canEd=false,isOwner=false,ME=null;
function calc(){const em=(ME?.email||'').toLowerCase();isAdmin=isOwner||(canEd&&(S.admins||[]).map(x=>String(x).toLowerCase()).includes(em))}
const M=n=>(S.site.cur||'$')+Number(n||0).toFixed(2);

async function boot(){
 S={site:{...SEED.site},...Object.fromEntries(COLS.map(c=>[c,[]]))};render();
 try{const [c,u,ast]=await getBackend();assets=ast;
  if(c){db=c;live=true;canEd=(await u?.canEdit?.())??false;isOwner=(await u?.isOwner?.())??false;try{ME=await u?.me?.()}catch(x){}calc();c.collection('site').doc('admins').onSnapshot(s=>{S.admins=s.exists?(s.data().emails||[]):[];calc();render()},e=>{err=e.message});
   COLS.forEach(n=>c.collection(n).onSnapshot(s=>{S[n]=s.docs.map(d=>({id:d.id,...d.data()}));render()},e=>{err=e.message}));
   c.collection('site').doc('main').onSnapshot(s=>{if(s.exists)S.site={...SEED.site,...s.data()};render()});
   setTimeout(()=>{if(live&&COLS.every(n=>!S[n].length)){COLS.slice(0,3).forEach(n=>S[n]=SEED[n]);render()}},2500)}
 }catch(e){err=e.message}
 if(!live){COLS.forEach(n=>S[n]=SEED[n]||[]);render()}}
const pub=a=>a.filter(x=>x.published!==false);
const img=(x,k)=>x[k||'img']?`style="background-image:url('${esc(x[k||'img'])}')"`:'';
const crName=id=>(S.creators.find(c=>c.id===id)||{}).name||'';
const avail=p=>p.stock==null||p.stock===''?'Available':p.stock>0?(p.stock<=5?'Only '+p.stock+' left':'In stock'):'Sold out';
const okUrl=u=>/^https:\/\//.test(u||'')?u:'';
const buyUrl=p=>okUrl(p.buy)||okUrl(p.kind=='game'?S.site.tebex:p.kind=='discord'?S.site.kofi:'');
const howTo=p=>{if(!p.kind)return '';const n=S.site.payNote,d=okUrl(S.site.discordUrl);return `<div class="empty" style="text-align:left;margin-top:16px"><b class="px">How to buy</b><ol style="padding-left:20px;margin:10px 0"><li>Tap <b>Buy now</b>. You'll go to a secure payment page.</li><li>Enter your exact ${p.kind=='game'?'Minecraft username':'Discord username'} at checkout.</li><li>Pay there. This site never sees your card details.</li><li>${p.kind=='game'?'Your rank is given on the server after payment.':'Your role is given in Discord after payment.'}</li></ol>${n?`<p>${esc(n)}</p>`:''}${d?`<p>Need help? <a href="${esc(d)}" target="_blank" rel="noopener noreferrer">Join our Discord</a></p>`:''}</div>`};
function pcard(p){const off=p.orig>p.price?Math.round(100-p.price/p.orig*100):0;
 return `<a class="card" href="#p/${p.id}"><div class="thumb" ${img(p)}>${p.img?'':esc((p.name||'?')[0])}</div><div class="cb"><div>${p.featured?'<span class="tag g">Featured</span>':''}${p.limited?'<span class="tag r">Limited</span>':''}${off?`<span class="tag c">-${off}%</span>`:''}${p.kind?`<span class="tag c">${p.kind=='game'?'Game rank':'Discord rank'}</span>`:''}</div><h3>${esc(p.name)}</h3><div class="price">${M(p.price)}${p.orig>p.price?`<s>${M(p.orig)}</s>`:''}</div><small>${avail(p)}</small></div></a>`}

async function shrink(f){try{const b=await createImageBitmap(f),sc=Math.min(1,1600/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=Math.round(b.width*sc);c.height=Math.round(b.height*sc);c.getContext('2d').drawImage(b,0,0,c.width,c.height);return await new Promise((ok,no)=>c.toBlob(x=>x?ok(x):no(new Error('Could not process image')),'image/webp',.82))}catch(e){if(f.size>8e6)throw new Error('Image too large (max 8 MB)');return f}}

function countUp(){document.querySelectorAll('[data-n]').forEach(el=>{const n=+el.dataset.n;if(RM.matches||!n){el.textContent=n;return}const t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/900);el.textContent=Math.round(n*k);if(k<1)requestAnimationFrame(f)})(t0)})}
addEventListener('scroll',()=>{const h=document.documentElement;$('#prog').style.width=(scrollY/((h.scrollHeight-innerHeight)||1)*100)+'%';document.querySelector('header').classList.toggle('sc',scrollY>20)},{passive:true});
document.addEventListener('click',e=>{const b=e.target.closest('.btn');if(!b||RM.matches)return;for(let i=0;i<10;i++){const s=document.createElement('i');s.className='spark';s.style.cssText=`left:${e.clientX}px;top:${e.clientY}px;background:${['#a6e34a','#f5b82e','#7ec8f2'][i%3]};--x:${(Math.random()-.5)*120}px;--y:${-30-Math.random()*90}px`;document.body.appendChild(s);setTimeout(()=>s.remove(),700)}});
setTimeout(()=>$('#splash').classList.add('out'),1600);
boot();
</script></body></html>
